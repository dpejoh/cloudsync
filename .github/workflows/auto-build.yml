name: BuildCI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install plugin dependencies
        run: npm install

      - name: Build and typecheck plugin
        run: npm run build-check

      - name: Install worker dependencies and test VPS server
        run: |
          cd worker
          npm install
          npm run test:vps

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-cloudsync
          path: |
            main.js
            manifest.json
            styles.css

services:
  cloudsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudsync-server:latest
    container_name: cloudsync-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - WORKER_MODE=multi # Options: "multi" (full user accounts + 2FA) or "single" (personal vault master password)
      # - JWT_SECRET=change-this-to-a-secure-random-string # Optional: auto-generated and persisted in /data if omitted
      # - SINGLE_USER_PASSWORD=your-secret-password # REQUIRED for fresh deployments when WORKER_MODE is "single"
      # - TRUST_PROXY=1 # Set only when running behind a trusted reverse proxy that sets X-Real-IP
    security_opt:
      - no-new-privileges:true
    volumes:
      # Persistent SQLite DB, file versions, trash, and vault data
      - ./data:/data
